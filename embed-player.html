<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>91.3 Ayclt FM TV — Live Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    #ayclt-tv-player {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    .tv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px;
      background: #181818;
      border-bottom: 3px solid #e31b35;
    }
    .tv-brand h1 { margin: 0; font-size: 23px; font-weight: 800; }
    .tv-brand p { margin: 6px 0 0; color: #aaa; font-size: 11px; letter-spacing: 2px; }
    .tv-status { color: #ff4055; font-size: 12px; font-weight: bold; white-space: nowrap; }
    .tv-screen { width: 100%; aspect-ratio: 16 / 9; background: #000; }
    .tv-screen video {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      object-fit: contain;
    }
    .tv-controls { display: block; padding: 20px; }
    .tv-controls h2 { margin: 0 0 15px; font-size: 13px; letter-spacing: 1.5px; color: #aaa; }
    .tv-buttons {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }
    .tv-buttons button {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      min-width: 0;
      min-height: 58px;
      padding: 12px;
      background: #242424;
      border: 1px solid #555;
      border-radius: 7px;
      color: #fff;
      cursor: pointer;
      font: bold 13px Arial, Helvetica, sans-serif;
      text-align: center;
    }
    .tv-buttons button span {
      display: block;
      color: #bbb;
      font-size: 10px;
      margin-bottom: 5px;
    }
    .tv-buttons button:hover,
    .tv-buttons button:focus-visible {
      background: #383838;
      border-color: #e31b35;
      outline: 2px solid #e31b35;
      outline-offset: 2px;
    }
    .tv-buttons button.active { background: #e31b35; border-color: #e31b35; }
    .tv-buttons button.active span { color: #fff; }
    .tv-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 15px 20px;
      background: #080808;
      border-top: 1px solid #292929;
      font-size: 11px;
      color: #888;
    }
    .tv-footer strong { color: #fff; }
    @media (max-width: 650px) {
      body { padding: 8px; }
      .tv-header { padding: 15px; }
      .tv-brand h1 { font-size: 18px; }
      .tv-buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tv-controls { padding: 15px; }
    }
    @media (max-width: 380px) {
      .tv-status { font-size: 9px; }
      .tv-buttons button { font-size: 11px; padding: 10px 5px; }
    }
  </style>
</head>
<body>
  <main id="ayclt-tv-player">
    <header class="tv-header">
      <div class="tv-brand">
        <h1>91.3 Ayclt FM TV</h1>
        <p>LIVE TELEVISION NETWORK</p>
      </div>
      <span class="tv-status">● TV PLAYER</span>
    </header>

    <section class="tv-screen" aria-label="Live television">
      <video id="tv-frame" controls playsinline webkit-playsinline preload="none"></video>
    </section>

    <section class="tv-controls" aria-label="Channel selection">
      <h2>SELECT A CHANNEL</h2>
      <div class="tv-buttons">
        <button class="active" type="button" data-channel="0"><span>01</span>91.3 Ayclt FM</button>
        <button type="button" data-channel="1"><span>02</span>91.3 Ayclt FM HD2</button>
        <button type="button" data-channel="2"><span>03</span>91.3 Ayclt FM HD3</button>
        <button type="button" data-channel="3"><span>04</span>Live Studio Cam</button>
        <button type="button" data-channel="4"><span>05</span>Mobile Studio Cam</button>
      </div>
    </section>

    <footer class="tv-footer">
      <strong>91.3 Ayclt FM</strong>
      <span>© All Rights Reserved</span>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    (function () {
      const channels = [
        "https://tv.913aycltfm.com/memfs/37c1cf56-8954-42d5-b7a4-7c80abb86c48.m3u8",
        "https://tv.913aycltfm.com/memfs/b502bd6f-86eb-4ca0-91c0-f09fb6a8f76e.m3u8",
        "https://tv.913aycltfm.com/memfs/c421623b-6171-4fc8-8514-86993233d910.m3u8",
        "https://tv.913aycltfm.com/memfs/02f36ef2-64c7-446c-a5c8-ca2fca15d02e.m3u8",
        "https://tv.913aycltfm.com/memfs/034825aa-0374-40a9-8ebb-5cf4d3b05dfe.m3u8"
      ];

      const video = document.getElementById("tv-frame");
      const buttons = document.querySelectorAll(".tv-buttons button");
      let hls = null;

      function selectChannel(index) {
        if (!video || !channels[index]) return;

        if (hls) {
          hls.destroy();
          hls = null;
        }

        video.pause();
        video.removeAttribute("src");
        video.load();

        if (window.Hls && Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(channels[index]);
          hls.attachMedia(video);
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = channels[index];
        } else {
          alert("This browser does not support HLS playback.");
          return;
        }

        buttons.forEach(function (button) {
          const selected = Number(button.dataset.channel) === index;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-pressed", selected ? "true" : "false");
        });
      }

      buttons.forEach(function (button) {
        button.addEventListener("click", function () {
          selectChannel(Number(button.dataset.channel));
        });
      });

      if (buttons.length) selectChannel(0);
    })();
  </script>
</body>
</html>
